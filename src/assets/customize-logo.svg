<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="65%">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="0.55" stop-color="#090e15"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#e9e8e0"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202b37"/>
      <stop offset="1" stop-color="#0d141d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7ffff"/>
      <stop offset="0.45" stop-color="#45e5df"/>
      <stop offset="1" stop-color="#159fa9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <!-- atmospheric background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="570" rx="350" ry="330" fill="#1bd7d2" opacity=".07" filter="url(#softGlow)"/>

  <!-- pixelated cyan rim around the document -->
  <path d="M391 280H749V294H763V308H777V322H791V336H805V350H819V365H833V414H847V667H861V681H875V695H889V709H903V723H917V737H903V751H875V765H847V779H721V793H435V779H407V765H379V751H351V737H337V709H351V695H365V681H379V667H393V322H379V308H391Z"
        fill="none" stroke="#5cf7f2" stroke-width="4" opacity=".9" filter="url(#glow)"/>

  <!-- document shadow -->
  <rect x="392" y="301" width="462" height="478" rx="3" fill="#000" opacity=".65"/>

  <!-- document body, intentionally blocky -->
  <path d="M410 304H728V318H742V332H756V346H770V360H784V374H798V388H812V416H826V739H812V753H728V767H438V753H424V739H410Z"
        fill="url(#paper)" stroke="#0b121a" stroke-width="10"/>

  <!-- folded corner -->
  <path d="M728 304V402H826L728 304Z" fill="#d9ddd9" stroke="#0b121a" stroke-width="9"/>
  <path d="M742 318V388H812Z" fill="#f5f4ec"/>

  <!-- M -->
  <path d="M468 433H496V447H510V461H524V475H538V461H552V447H566V433H594V571H566V489H552V503H538V517H524V503H510V489H496V571H468Z"
        fill="#101923"/>

  <!-- download arrow -->
  <path d="M615 433H643V489H671V503H685V517H699V531H685V545H671V559H657V573H629V559H615V545H601V531H587V517H601V503H615V489H615Z"
        fill="#101923"/>

  <!-- document text -->
  <rect x="468" y="622" width="300" height="18" fill="#687581"/>
  <rect x="468" y="672" width="210" height="18" fill="#687581"/>
  <rect x="468" y="719" width="48" height="18" fill="#687581"/>
  <rect x="532" y="719" width="48" height="18" fill="#687581"/>

  <!-- tray -->
  <path d="M350 681H424V739H438V753H728V739H742V681H891V695H905V709H919V895H905V909H891V923H351V909H337V895H323V709H337V695H350Z"
        fill="url(#tray)" stroke="#313e4a" stroke-width="8"/>

  <!-- tray upper lip -->
  <path d="M337 748H424V762H438V776H728V762H742V748H905V762H742V776H728V790H438V776H424V762H337Z"
        fill="#3b4652"/>
  <path d="M351 762H410V776H438V790H728V776H756V762H891"
        fill="none" stroke="#121a23" stroke-width="8"/>

  <!-- status light -->
  <rect x="376" y="813" width="38" height="38" fill="#0b4d55" opacity=".8" filter="url(#glow)"/>
  <rect x="382" y="819" width="26" height="26" fill="url(#cyan)"/>

  <!-- terminal prompt -->
  <path d="M766 807H780V821H794V835H808V849H794V863H780V877H766V863H780V849H794V835H780V821H766Z"
        fill="#c8d4dc"/>
  <rect x="820" y="864" width="44" height="14" fill="#c8d4dc"/>

  <!-- subtle pixel highlights -->
  <rect x="421" y="286" width="315" height="5" fill="#b8ffff" opacity=".55"/>
  <rect x="762" y="315" width="8" height="8" fill="#4ce9e4"/>
  <rect x="776" y="329" width="8" height="8" fill="#2dc8ce"/>
  <rect x="790" y="343" width="8" height="8" fill="#1da7b2"/>

  <!-- understated ground glow -->
  <ellipse cx="512" cy="934" rx="260" ry="24" fill="#23d5d2" opacity=".08" filter="url(#softGlow)"/>
</svg>