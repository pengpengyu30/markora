name: Sync fork with upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method POST \
            "repos/${REPOSITORY}/merge-upstream" \
            --field branch=main
